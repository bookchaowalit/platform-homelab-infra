# CI + security baseline (DevSecOps Phase 1). Public repository: GitHub-hosted runners.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      python-version: "3.11" # matches the data-lake worker image (python:3.11-slim); the scripts use the stdlib only
      # Install = `uv sync --frozen --all-extras` from the root uv.lock (dev tools only);
      # typecheck = strict mypy from [tool.mypy] in pyproject.toml.
      # The offline suites are standalone scripts (README); compose_validation_test also runs in
      # compose-validate.yml next to `docker compose config`, which stays as is.
      test-command: >-
        python infra/tests/platform/compose_validation_test.py &&
        python infra/tests/integrations/frappe_dashboard_reader_test.py &&
        python infra/tests/integrations/frappe_fx_guard_test.py &&
        python infra/tests/mlops/mlops_observability_test.py &&
        python infra/tests/data_lake/minio_policy_test.py

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
