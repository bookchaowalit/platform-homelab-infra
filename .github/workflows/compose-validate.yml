name: Compose Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  compose-config:
    name: Compose Config (lab)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate compose with placeholder env
        run: |
          set -euo pipefail
          cd infra/self-hosted-stack
          set -a
          # shellcheck disable=SC1091
          source .env.example
          set +a
          docker compose -f docker-compose.yml config --quiet
      - name: Offline compose security checks
        run: python3 infra/tests/platform/compose_validation_test.py
