# Prometheus Configuration
# Scrapes metrics from services in the Solo Empire stack

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alert rules
rule_files:
  - 'rules.yml'

# Alertmanager
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['se-alertmanager:9093']

scrape_configs:
  # Keep this list limited to services that are present in the Compose lab and
  # expose a Prometheus-compatible endpoint. Optional/disabled services belong
  # in a separately approved target file so they cannot create false alerts.

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter - System metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['se-node-exporter:9100']

  # Traefik metrics
  - job_name: 'traefik'
    static_configs:
      - targets: ['se-traefik:80']
    metrics_path: '/metrics'

  # Loki metrics
  - job_name: 'loki'
    static_configs:
      - targets: ['se-loki:3100']
    metrics_path: '/metrics'

  # InfluxDB metrics
  - job_name: 'influxdb'
    static_configs:
      - targets: ['se-influxdb:8086']
    metrics_path: '/metrics'

  # Tempo metrics
  - job_name: 'tempo'
    static_configs:
      - targets: ['se-tempo:3200']
    metrics_path: '/metrics'

  # Local MLOps reference serving. The file is intentionally empty by default;
  # add an approved localhost target only when serve.py is running.
  - job_name: 'solo-empire-mlops-reference'
    file_sd_configs:
      - files: ['/etc/prometheus/mlops-targets.json']
        refresh_interval: 30s
    metrics_path: '/metrics'
