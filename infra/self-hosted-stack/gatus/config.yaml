# Gatus Health Check Configuration
# Monitors all 81 lightweight services in the self-hosted stack
# Learning: Uptime monitoring, health endpoints, alerting

# Web UI available at http://localhost:3027

endpoints:
  # ============================================================
  # Wave 1: Core Infrastructure (8 services)
  # ============================================================
  - name: Traefik
    group: Core Infrastructure
    url: "http://se-traefik:8088/api/overview"
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].http.totalRouterCount >= 0"

  - name: Portainer
    group: Core Infrastructure
    url: "http://se-portainer:9000/api/system/status"
    interval: 1m
    conditions:
      - "[STATUS] == 200"

  - name: Dozzle
    group: Core Infrastructure
    url: "http://se-dozzle:8080"
    interval: 1m
    conditions:
      - "[STATUS] == 200"

  - name: Watchtower
    group: Core Infrastructure
    url: "tcp://se-watchtower:8080"
    interval: 5m
    conditions:
      - "[CONNECTED] == true"
    enabled: false  # No exposed port

  - name: Autoheal
    group: Core Infrastructure
    url: "tcp://se-autoheal:0"
    interval: 5m
    conditions:
      - "[CONNECTED] == true"
    enabled: false  # Background daemon

