  # 74. Redis Commander - Redis GUI (~20MB)
  redis-commander:
    image: rediscommander/redis-commander:0.8.1
    container_name: se-redis-commander
    restart: unless-stopped
    profiles:
      - optional
    environment:
      - REDIS_HOSTS=local:se-valkey:6379
    depends_on:
      - valkey
    networks:
      - solo-empire-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.redis.rule=Host(`redis.local`)"
      - "traefik.http.routers.redis.entrypoints=websecure"
      - "traefik.http.routers.redis.tls=true"
      - "traefik.http.services.redis.loadbalancer.server.port=8081"

  # 75. Sharry - File Sharing (~40MB)
  sharry:
    image: eikek0/sharry:1.14.0
    container_name: se-sharry
    restart: unless-stopped
    profiles:
      - optional
    volumes:
      - sharry-data:/var/lib/sharry
    networks:
      - solo-empire-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sharry.rule=Host(`sharry.local`)"
      - "traefik.http.routers.sharry.entrypoints=websecure"
      - "traefik.http.routers.sharry.tls=true"
      - "traefik.http.services.sharry.loadbalancer.server.port=9090"

  # ============================================================
  # Wave 20: Specialized Tools (6 services)
  # ============================================================

  # 76. SpiceDB - Authorization Database (~25MB)
  spicedb:
    image: authzed/spicedb:v1.34.0
    container_name: se-spicedb
    restart: unless-stopped
    profiles:
      - devsecops
      - shared-platform
    command: serve --grpc-preshared-key ${SPICEDB_GRPC_PRESHARED_KEY} --http-enabled --http-addr=:8443 --datastore-engine=memory
    volumes:
      - spicedb-data:/data
    networks:
      - solo-empire-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.spicedb.rule=Host(`spicedb.local`)"
      - "traefik.http.routers.spicedb.entrypoints=websecure"
      - "traefik.http.routers.spicedb.tls=true"
      - "traefik.http.services.spicedb.loadbalancer.server.port=8443"

  # 77. Kestra - Workflow Orchestration (~60MB)
  kestra:
    image: kestra/kestra:v0.18.0
    container_name: se-kestra
    restart: unless-stopped
    profiles:
      - data
    # Lab: Postgres repository/queue + local file storage (not production HA).
    # The Docker task runner requires direct host control; keep `data` local-only.
    user: "root"
    command: server standalone --worker-thread=4
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - kestra-data:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://se-postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: ${POSTGRES_USER}
            password: ${POSTGRES_PASSWORD}
        kestra:
          server:
            basic-auth:
              enabled: false
          repository:
            type: postgres
          queue:
            type: postgres
          storage:
            type: local
            local:
              base-path: "/app/storage"
    networks:
      - solo-empire-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kestra.rule=Host(`kestra.local`)"
      - "traefik.http.routers.kestra.entrypoints=websecure"
      - "traefik.http.routers.kestra.tls=true"
      - "traefik.http.services.kestra.loadbalancer.server.port=8080"

  # 78. Traccar - GPS Tracking (~40MB)
  traccar:
    image: traccar/traccar:6.3
    container_name: se-traccar
    restart: unless-stopped
    profiles:
      - optional
    volumes:
      - traccar-data:/opt/traccar
    networks:
      - solo-empire-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traccar.rule=Host(`traccar.local`)"
      - "traefik.http.routers.traccar.entrypoints=websecure"
      - "traefik.http.routers.traccar.tls=true"
      - "traefik.http.services.traccar.loadbalancer.server.port=8082"

  # 79. Tyk - API Gateway (~50MB)
  tyk:
    image: tykio/tyk-gateway:v5.4.0
    container_name: se-tyk
    restart: unless-stopped
    profiles:
      - devsecops
    volumes:
      - tyk-data:/opt/tyk-gateway
    environment:
      - TYK_GW_SECRET=${TYK_GW_SECRET}
      - TYK_GW_LISTENPORT=8080
    networks:
      - solo-empire-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tyk.rule=Host(`tyk.local`)"
      - "traefik.http.routers.tyk.entrypoints=websecure"
      - "traefik.http.routers.tyk.tls=true"
      - "traefik.http.services.tyk.loadbalancer.server.port=8080"

  # 80. JSON Schema Store - Schema Validator (~10MB)
  jsonschema:
    image: python:3.11-slim
    container_name: se-jsonschema
    restart: unless-stopped
    profiles:
      - optional
    working_dir: /data
    volumes:
      - ./jsonschema:/data
    command: >
      bash -c "pip install --no-cache-dir jsonschema &&
      echo 'JSON Schema validator ready.' &&
      tail -f /dev/null"
    networks:
      - solo-empire-net
    labels:
      - "traefik.enable=false"

  # 81. Squid - Proxy Cache (~20MB)
  squid:
    image: ubuntu/squid:6.6-24.04_beta
    container_name: se-squid
    restart: unless-stopped
    profiles:
      - optional
    volumes:
      - squid-data:/etc/squid
      - squid-data:/var/spool/squid
    networks:
      - solo-empire-net
    labels:
      - "traefik.enable=false"
