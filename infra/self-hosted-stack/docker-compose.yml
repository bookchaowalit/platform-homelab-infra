    environment:
      - BW_PORT=8000
      - BW_HOST=0.0.0.0
    networks:
      - solo-empire-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.breezewiki.rule=Host(`breezewiki.local`)"
      - "traefik.http.routers.breezewiki.entrypoints=websecure"
      - "traefik.http.routers.breezewiki.tls=true"
      - "traefik.http.services.breezewiki.loadbalancer.server.port=8000"

  # ============================================================
  # Wave 14: Publishing & Blogging (3 services)
  # ============================================================

  # 60. Ghost - Publishing Platform (~100MB)
  ghost:
    image: ghost:5.89.5-alpine
    container_name: se-ghost
    restart: unless-stopped
    profiles:
