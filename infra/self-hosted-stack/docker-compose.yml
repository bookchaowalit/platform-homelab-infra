    environment:
      - url=http://ghost.local
      - database__client=sqlite3
      - database__connection__filename=/var/lib/ghost/content/data/ghost.db
    volumes:
      - ghost-data:/var/lib/ghost/content
    networks:
      - solo-empire-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ghost.rule=Host(`ghost.local`)"
      - "traefik.http.routers.ghost.entrypoints=websecure"
      - "traefik.http.routers.ghost.tls=true"
      - "traefik.http.services.ghost.loadbalancer.server.port=2368"

  # 61. BookStack - Wiki/Knowledge Base (~50MB)
  bookstack-db:
    image: mariadb:11.4.2
    container_name: se-bookstack-db
    restart: unless-stopped
    profiles:
      - optional
    environment:
      - MARIADB_ROOT_PASSWORD=${BOOKSTACK_MARIADB_ROOT_PASSWORD}
      - MARIADB_DATABASE=bookstack
      - MARIADB_USER=${BOOKSTACK_DB_USER}
      - MARIADB_PASSWORD=${BOOKSTACK_DB_PASSWORD}
    volumes:
      - bookstack-db-data:/var/lib/mysql
    networks:
      - solo-empire-net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--mariadbupgrade"]
      interval: 10s
      timeout: 5s
      retries: 5

  bookstack:
    image: linuxserver/bookstack:24.05.2
    container_name: se-bookstack
    restart: unless-stopped
    profiles:
      - optional
    environment:
      - APP_URL=https://bookstack.local
      - APP_KEY=${BOOKSTACK_APP_KEY}
      - DB_HOST=se-bookstack-db
      - DB_PORT=3306
      - DB_USER=${BOOKSTACK_DB_USER}
      - DB_PASS=${BOOKSTACK_DB_PASSWORD}
      - DB_DATABASE=bookstack
    volumes:
      - bookstack-data:/config
    depends_on:
      bookstack-db:
        condition: service_healthy
    networks:
      - solo-empire-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bookstack.rule=Host(`bookstack.local`)"
      - "traefik.http.routers.bookstack.entrypoints=websecure"
      - "traefik.http.routers.bookstack.tls=true"
      - "traefik.http.services.bookstack.loadbalancer.server.port=80"

  # ============================================================
  # Wave 15: Dashboards (1 service)
  # ============================================================

  # 62. Homer - Dashboard (~10MB)
  homer:
    image: b4bz/homer:v24.05.1
    container_name: se-homer
    restart: unless-stopped
    profiles:
      - core
      - shared-platform
    volumes:
      - ./homer:/www/assets
    networks:
      - solo-empire-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homer.rule=Host(`homer.local`)"
      - "traefik.http.routers.homer.entrypoints=websecure"
      - "traefik.http.routers.homer.tls=true"
      - "traefik.http.services.homer.loadbalancer.server.port=8080"

  # ============================================================
  # Wave 16: Advanced Monitoring (5 services)
  # ============================================================

  # 63. Tempo - Distributed Tracing (~30MB)
  tempo:
    image: grafana/tempo:2.5.0
    container_name: se-tempo
    restart: unless-stopped
    profiles:
      - observability
      - shared-platform
    command: -config.file=/etc/tempo.yml
    volumes:
      - ./tempo/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/tmp/tempo
    ports:
      # OTLP receivers, bound to loopback only — matches infra/api/telemetry.ts's
      # default OTEL_EXPORTER_OTLP_ENDPOINT (http://localhost:4318/v1/traces)
      # for a host-run (non-Compose) API process.
      - "127.0.0.1:4318:4318" # OTLP/HTTP
      - "127.0.0.1:4317:4317" # OTLP/gRPC
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3200/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - solo-empire-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tempo.rule=Host(`tempo.local`)"
      - "traefik.http.routers.tempo.entrypoints=websecure"
      - "traefik.http.routers.tempo.tls=true"
      - "traefik.http.services.tempo.loadbalancer.server.port=3200"

